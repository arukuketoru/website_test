<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>論文検索サイト</title>
    <style>
        h6 {
            font-size: 1.0rem;
            color: crimson;
            margin-bottom: 20px;
            border-bottom: 7px double #666;
        }
    </style>
</head>

<body>
    <a href="/" class="home-link">← ホームに戻る</a>
    <h1>論文検索</h1>
    <h6>現在こちらの機能は利用できません</h6>

    <form method="POST" action="/search">
        <input type="text" name="keywords" placeholder="検索ワードを入力" required>
        <button type="submit">検索</button>
    </form>

    <hr>

    <h2>検索結果</h2>

    {% if results %}
    <ul>
        {% for item in results %}
        <li>
            <strong>{{ loop.index }}.</strong> <a href="{{ item.url }}" target="_blank">{{ item.title }}</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>検索ワードを入力して論文を検索してください。</p>
    {% if request.method == 'POST' and not results %}
    <p>検索結果が見つからなかったか、エラーが発生しました。</p>
    {% endif %}
    {% endif %}

</body>

</html>
